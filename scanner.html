
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SA Inventory - Barcode Scanner</title>

  <script src="https://unpkg.com/@zxing/browser@0.1.5/umd/index.min.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      background: #10263b;
      font-family: Arial, sans-serif;
      color: #17324d;
    }

    .scanner-box {
      width: 100%;
      max-width: 540px;
      margin: 5px auto;
      padding: 20px;
      background: white;
      border-radius: 15px;
      text-align: center;
    }

    h2 { margin: 18px 0; }

    video {
      display: block;
      width: 100%;
      height: 300px;
      background: black;
      border-radius: 10px;
      object-fit: cover;
      margin: 15px 0;
    }

    select, button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: 0;
      border-radius: 7px;
      font-size: 15px;
    }

    select {
      border: 1px solid #bbb;
      background: white;
    }

    button {
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    #startBtn { background: #1976d2; }
    #stopBtn { background: #dc2626; }
    #copyBtn { background: #198754; }

    #status {
      min-height: 24px;
      line-height: 1.5;
      margin: 12px 0;
    }

    #result {
      width: 100%;
      padding: 13px;
      border: 1px solid #aaa;
      border-radius: 7px;
      font-size: 16px;
      text-align: center;
      overflow-wrap: anywhere;
    }

    @media(max-width: 480px) {
      body { padding: 12px; }
      .scanner-box { padding: 15px; }
      video { height: 280px; }
    }
  </style>
</head>

<body>
  <div class="scanner-box">
    <h2>BARCODE SCANNER</h2>
    <p>Arahkan kamera belakang ke Barcode 1D atau QR Code</p>

    <video id="scannerVideo" autoplay muted playsinline></video>

    <select id="cameraSelect">
      <option value="">Kamera otomatis</option>
    </select>

    <button id="startBtn" onclick="startScanner()">
      START SCANNER
    </button>

    <button id="stopBtn" onclick="stopScanner()">
      CLOSE CAMERA
    </button>

    <p id="status">Tekan START SCANNER untuk memulai.</p>

    <h3>HASIL SCAN</h3>
    <div id="result">Belum ada barcode</div>

    <button id="copyBtn" onclick="copyResult()">
      COPY HASIL
    </button>
  </div>

<script>
  let reader = null;
  let scannerControls = null;
  let activeStream = null;
  let scanning = false;
  let scanLocked = false;

  const video = document.getElementById('scannerVideo');
  const statusText = document.getElementById('status');
  const resultBox = document.getElementById('result');
  const cameraSelect = document.getElementById('cameraSelect');

  async function startScanner() {
    if (scanning) return;

    if (!window.ZXingBrowser ||
        !window.ZXingBrowser.BrowserMultiFormatReader) {
      statusText.textContent =
        'Library scanner gagal dimuat. Periksa koneksi internet.';
      return;
    }

    scanning = true;
    scanLocked = false;
    resultBox.textContent = 'Belum ada barcode';
    statusText.textContent = 'Meminta izin kamera...';

    try {
      reader = new ZXingBrowser.BrowserMultiFormatReader();

      let stream;

      // Prioritaskan kamera belakang Android.
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: 'environment' },
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        });
      } catch (firstError) {
        console.warn('Kamera belakang otomatis gagal:', firstError);

        // Coba mencari kamera belakang melalui daftar perangkat.
        const devices =
          await navigator.mediaDevices.enumerateDevices();

        const cameras = devices.filter(
          device => device.kind === 'videoinput'
        );

        const rearCamera = cameras.find(device =>
          /back|rear|environment|belakang/i.test(device.label)
        );

        if (rearCamera && rearCamera.deviceId) {
          stream = await navigator.mediaDevices.getUserMedia({
            video: {
              deviceId: { exact: rearCamera.deviceId }
            },
            audio: false
          });
        } else {
          // Fallback terakhir agar pengguna tetap dapat mencoba kamera.
          stream = await navigator.mediaDevices.getUserMedia({
            video: true,
            audio: false
          });
        }
      }

      activeStream = stream;
      video.srcObject = stream;
      await video.play();

      await loadCameraList();

      statusText.textContent =
        'Kamera aktif. Arahkan ke barcode atau QR Code.';

      scannerControls = await reader.decodeFromStream(
        stream,
        video,
        (result, error) => {
          if (result && !scanLocked) {
            scanLocked = true;

            const value = result.getText().trim();
            resultBox.textContent = value;
            statusText.textContent = 'Barcode berhasil dibaca!';

            // Hentikan kamera setelah satu hasil berhasil dibaca.
            stopScanner();
            statusText.textContent =
              'Scan berhasil: ' + value;
          }
        }
      );

    } catch (error) {
      console.error(error);
      stopScanner();

      statusText.textContent =
        'Gagal membuka kamera: ' + error.message;
    }
  }

  async function loadCameraList() {
    try {
      const devices =
        await navigator.mediaDevices.enumerateDevices();

      const cameras = devices.filter(
        device => device.kind === 'videoinput'
      );

      cameraSelect.innerHTML =
        '<option value="">Kamera otomatis</option>';

      cameras.forEach((camera, index) => {
        const option = document.createElement('option');
        option.value = camera.deviceId;
        option.textContent =
          camera.label || ('Kamera ' + (index + 1));

        cameraSelect.appendChild(option);
      });

      const rear = cameras.find(camera =>
        /back|rear|environment|belakang/i.test(camera.label)
      );

      if (rear) cameraSelect.value = rear.deviceId;

    } catch (error) {
      console.warn('Daftar kamera tidak tersedia:', error);
    }
  }

  async function stopScanner() {
    scanning = false;

    if (scannerControls) {
      try {
        await scannerControls.stop();
      } catch (error) {
        console.warn(error);
      }
      scannerControls = null;
    }

    if (activeStream) {
      activeStream.getTracks().forEach(track => track.stop());
      activeStream = null;
    }

    if (video.srcObject) {
      video.srcObject = null;
    }

    statusText.textContent = 'Kamera telah ditutup.';
  }

  async function copyResult() {
    const value = resultBox.textContent;

    if (!value || value === 'Belum ada barcode') {
      statusText.textContent = 'Belum ada hasil scan.';
      return;
    }

    try {
      await navigator.clipboard.writeText(value);
      statusText.textContent = 'Hasil berhasil disalin.';
    } catch (error) {
      statusText.textContent =
        'Tidak dapat menyalin hasil: ' + error.message;
    }
  }

  cameraSelect.addEventListener('change', async function() {
    const deviceId = this.value;
    if (!deviceId) return;

    await stopScanner();

    try {
      scanning = true;
      scanLocked = false;
      reader = new ZXingBrowser.BrowserMultiFormatReader();

      const stream = await navigator.mediaDevices.getUserMedia({
        video: {
          deviceId: { exact: deviceId }
        },
        audio: false
      });

      activeStream = stream;
      video.srcObject = stream;
      await video.play();

      scannerControls = await reader.decodeFromStream(
        stream,
        video,
        result => {
          if (result && !scanLocked) {
            scanLocked = true;
            resultBox.textContent = result.getText().trim();
            stopScanner();
          }
        }
      );

      statusText.textContent = 'Kamera pilihan aktif.';

    } catch (error) {
      console.error(error);
      stopScanner();
      statusText.textContent =
        'Gagal mengganti kamera: ' + error.message;
    }
  });

  window.addEventListener('pagehide', stopScanner);
</script>
</body>
</html>
