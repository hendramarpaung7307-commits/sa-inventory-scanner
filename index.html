<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SA Inventory Barcode Scanner</title>
  <script src="https://unpkg.com/@zxing/browser@0.1.5/umd/zxing-browser.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background:#10243a; color:white; text-align:center; padding:12px; margin:0; }
    .scanner-box { width:100%; max-width:500px; margin:18px auto; background:white; color:#203247; padding:18px; border-radius:15px; }
    video { display:block; width:100%; min-height:240px; max-height:65vh; object-fit:contain; background:#000; border-radius:10px; }
    button { width:100%; padding:14px; margin-top:12px; border:0; border-radius:7px; font-size:16px; font-weight:bold; cursor:pointer; }
    #startBtn { background:#1677d2; color:white; }
    #closeBtn { background:#dc2626; color:white; }
    #status { font-size:15px; line-height:1.4; margin-top:15px; overflow-wrap:anywhere; }
  </style>
</head>
<body>
  <div class="scanner-box">
    <h2>BARCODE SCANNER</h2>
    <p>Arahkan kamera ke Barcode atau QR Code. Untuk QR SA Material, pastikan seluruh kotak QR terlihat jelas dan memenuhi area kamera.</p>
    <video id="scannerVideo" autoplay muted playsinline></video>
    <div id="status" role="status">Tekan START SCANNER untuk mulai.</div>
    <button id="startBtn" type="button" onclick="startScanner()">START SCANNER</button>
    <button id="closeBtn" type="button" onclick="closeScanner()">CLOSE</button>
  </div>

  <script>
    let controls = null;
    let reader = null;
    let locked = false;

    const video = document.getElementById('scannerVideo');
    const statusText = document.getElementById('status');
    const startBtn = document.getElementById('startBtn');

    function isNormalDecodeMiss(error) {
      if (!error) return false;
      const name = String(error.name || error.constructor?.name || '');
      const message = String(error.message || error);
      return /NotFoundException|ChecksumException|FormatException/i.test(name) ||
        /No (MultiFormat )?Readers? were able to detect the code|checksum|format exception/i.test(message);
    }

    async function startScanner() {
      closeScanner();
      if (!window.ZXingBrowser ||
          typeof window.ZXingBrowser.BrowserMultiFormatReader !== 'function') {
        statusText.textContent = 'Library scanner gagal dimuat. Periksa koneksi internet.';
        return;
      }

      try {
        locked = false;
        startBtn.disabled = true;
        statusText.textContent = 'Meminta izin kamera...';

        const Z = window.ZXingBrowser;
        const formats = Z.BarcodeFormat || {};
        const hintTypes = Z.DecodeHintType || {};

        const supportedFormats = [
          formats.QR_CODE, formats.CODE_128, formats.CODE_39,
          formats.CODE_93, formats.EAN_13, formats.EAN_8,
          formats.UPC_A, formats.UPC_E, formats.ITF, formats.CODABAR,
          formats.DATA_MATRIX, formats.PDF_417, formats.AZTEC
        ].filter(value => value !== undefined);

        // Hints harus diberikan saat membuat reader agar benar-benar diterapkan
        // oleh MultiFormatReader, bukan hanya disimpan pada properti terpisah.
        const hints = new Map();
        if (hintTypes.POSSIBLE_FORMATS !== undefined) {
          hints.set(hintTypes.POSSIBLE_FORMATS, supportedFormats);
        }
        if (hintTypes.TRY_HARDER !== undefined) {
          hints.set(hintTypes.TRY_HARDER, true);
        }

        reader = new Z.BrowserMultiFormatReader(hints);

        controls = await reader.decodeFromConstraints(
          {
            audio: false,
            video: {
              facingMode: { ideal: 'environment' },
              width: { ideal: 1920 },
              height: { ideal: 1080 }
            }
          },
          video,
          function(result, error) {
            if (result && !locked) {
              locked = true;
              const code = String(result.getText() || '').trim();
              if (!code) {
                locked = false;
                statusText.textContent = 'QR terbaca tetapi hasilnya kosong. Coba lagi.';
                return;
              }

              // Format SA Material sudah dipastikan sama dengan Part No di database.
              // Karena itu, kirim seluruh teks tanpa memotong atau mengubah angka.
              statusText.textContent = 'Berhasil membaca: ' + code;

              if (window.opener && !window.opener.closed) {
                window.opener.postMessage({
                  type: 'SA_INVENTORY_SCAN',
                  code: code
                }, '*');
                closeScanner();
              } else {
                locked = false;
                statusText.textContent = 'Kode terbaca, tetapi halaman SA Inventory tidak ditemukan. Buka scanner dari tombol SCAN aplikasi.';
              }
              return;
            }

            // Tidak menemukan QR pada satu frame adalah normal saat scanner mencari.
            if (error && !isNormalDecodeMiss(error)) {
              console.warn('Scanner error:', error);
              statusText.textContent = 'Scanner mengalami kendala. Coba tahan kamera lebih stabil.';
            }
          }
        );

        const track = video.srcObject && video.srcObject.getVideoTracks()[0];
        if (track && track.applyConstraints) {
          try {
            const caps = track.getCapabilities ? track.getCapabilities() : {};
            const advanced = [];
            if (caps.focusMode && caps.focusMode.includes('continuous')) {
              advanced.push({ focusMode: 'continuous' });
            }
            if (advanced.length) await track.applyConstraints({ advanced });
          } catch (_) {}
        }

        statusText.textContent = 'Kamera aktif. Dekatkan QR hingga terlihat tajam, seluruh kotak QR masuk kamera, lalu tahan HP stabil.';
      } catch (error) {
        console.error('Gagal membuka scanner:', error);
        const msg = String(error && error.message || error);
        if (error && (error.name === 'NotAllowedError' || /permission denied/i.test(msg))) {
          statusText.textContent = 'Akses kamera ditolak. Izinkan Camera untuk situs ini, lalu muat ulang scanner.';
        } else {
          statusText.textContent = 'Gagal membuka scanner: ' + msg;
        }
      } finally {
        startBtn.disabled = false;
      }
    }

    function closeScanner() {
      if (controls) {
        try { controls.stop(); } catch (_) {}
        controls = null;
      }
      if (video.srcObject) {
        video.srcObject.getTracks().forEach(track => track.stop());
        video.srcObject = null;
      }
      if (reader && typeof reader.reset === 'function') {
        try { reader.reset(); } catch (_) {}
      }
      reader = null;
      locked = false;
      if (startBtn) startBtn.disabled = false;
    }

    window.addEventListener('pagehide', closeScanner);
  </script>
</body>
</html>
